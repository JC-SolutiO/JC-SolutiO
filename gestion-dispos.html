<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des disponibilités — JC-SolutiO</title>
    <style>
        :root {
            --bleu-principal: #1b4965;
            --rouge-accent: #c1121f;
            --fond-pastel: #e6f2fa;
            --texte-sombre: #212529;
            --gris-doux: #6c757d;
            --fonte-originale: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --fonte-texte: "Lucida Calligraphy", "Apple Chancery", cursive;
        }

        body {
            font-family: var(--fonte-texte);
            line-height: 1.65;
            color: var(--texte-sombre);
            background-color: var(--fond-pastel);
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, .titre-site, .btn, .encadre-info, .zone-json, footer, label, small {
            font-family: var(--fonte-originale);
        }

        .conteneur {
            max-width: 960px;
            margin: 40px auto;
            background: #ffffff;
            padding: 45px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .rangee-haut {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--bleu-principal);
            padding-bottom: 20px;
            margin-bottom: 30px;
            gap: 20px;
        }

        .logo-image {
            max-width: 220px;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        .titre-site {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--rouge-accent);
            text-decoration: none;
        }

        h1 {
            color: var(--bleu-principal);
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
        }

        h2 {
            color: var(--bleu-principal);
            font-size: 1.2rem;
            margin-top: 28px;
            margin-bottom: 12px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 6px;
        }

        .encadre-info {
            background-color: #eef4f8;
            border-left: 5px solid var(--bleu-principal);
            padding: 15px 20px;
            border-radius: 0 6px 6px 0;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .grille-date {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 16px;
        }

        .bloc-champ {
            flex: 1 1 220px;
        }

        .bloc-champ label {
            display: block;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .champ-entree {
            width: 100%;
            padding: 9px 12px;
            font-family: var(--fonte-originale);
            font-size: 0.98rem;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        .champ-verrouille {
            background-color: #e9ecef;
            font-weight: 700;
            cursor: not-allowed;
        }

        .alerte-rouge {
            font-family: var(--fonte-originale);
            background-color: var(--rouge-accent);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 10px 14px;
            border-radius: 6px;
            margin: 12px 0;
            display: none;
        }

        .liste-plages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 14px 0 18px 0;
        }

        .carte-plage {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: var(--fonte-originale);
            font-size: 0.95rem;
            cursor: pointer;
        }

        .carte-plage input[type="checkbox"] {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: var(--rouge-accent);
        }

        .btn {
            font-family: var(--fonte-originale);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primaire {
            background-color: var(--bleu-principal);
            color: #ffffff;
        }
